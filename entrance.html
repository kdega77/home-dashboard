<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>Entrance Dashboard</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;color:#ffffff;font-family:"Segoe UI",Arial,sans-serif}
body{overflow:hidden;background:#0b1526;transition:background 2s}
body.dawn{background:radial-gradient(ellipse at 50% 115%,#b3622d 0%,#4a3560 42%,#131c33 78%)}
body.day{background:radial-gradient(ellipse at 50% -20%,#2e6da8 0%,#16294a 55%,#0b1526 100%)}
body.dusk{background:radial-gradient(ellipse at 50% 115%,#a34a2e 0%,#3d2c50 45%,#10182c 80%)}
body.night{background:radial-gradient(ellipse at 80% -10%,#1c2b4a 0%,#05080f 60%)}
body.night main{opacity:.6}
main{height:100vh;padding:2.6vh 3.5vw;display:flex;flex-direction:column;text-shadow:0 2px 10px rgba(0,0,0,.65)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:#d7e3f5;font-weight:600}
#clock{font-size:122px;line-height:1;font-weight:700;letter-spacing:-2px;margin-top:2px}
#date{font-size:29px;color:#eef3fb;margin-top:6px;font-weight:600}
.india{margin-top:14px;background:rgba(5,10,20,.45);border:1px solid rgba(180,205,240,.35);border-radius:14px;padding:10px 16px;display:inline-block}
.india-label{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#ffd9a0;font-weight:700}
#indiaTime{font-size:46px;font-weight:700;line-height:1.1}
#indiaDay{font-size:17px;color:#e8eef8}
.now{text-align:right;background:rgba(5,10,20,.45);border:1px solid rgba(180,205,240,.3);border-radius:18px;padding:14px 20px}
#nowIcon{font-size:70px;line-height:1}
#nowTemp{font-size:76px;font-weight:700;line-height:1.05}
#nowCond{font-size:24px;color:#eef3fb;font-weight:600}
#nowFeels{font-size:21px;color:#d7e3f5;margin-top:3px}
#todayRange{font-size:21px;color:#ffffff;margin-top:3px;font-weight:600}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(190,210,240,.5),transparent);margin:2.2vh 0}
.chips{display:flex;gap:14px}
.chip{flex:1;background:rgba(5,10,20,.5);border:1px solid rgba(180,205,240,.3);border-radius:16px;padding:14px 16px;text-align:center}
.chip-label{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#cfddF2;color:#cfddf2;font-weight:700}
.chip-value{font-size:33px;font-weight:700;margin-top:5px}
.chip-sub{font-size:16px;color:#e8eef8;margin-top:2px}
#advice{margin-top:2.2vh;background:rgba(5,10,20,.55);border:1px solid rgba(180,205,240,.35);border-radius:18px;padding:18px 24px;font-size:32px;font-weight:700;text-align:center}
#quote{margin-top:2.2vh;text-align:center;font-size:27px;font-style:italic;color:#f5ead2;padding:0 4vw;line-height:1.35}
#quoteAuthor{font-size:19px;font-style:normal;color:#d7e3f5;margin-top:5px}
.forecast{display:flex;gap:14px;margin-top:2.2vh;flex:1}
.day{flex:1;background:rgba(5,10,20,.5);border:1px solid rgba(180,205,240,.25);border-radius:16px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.day-name{font-size:19px;color:#d7e3f5;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.day-icon{font-size:50px;margin:8px 0}
.day-temp{font-size:30px;font-weight:700}
.day-rain{font-size:19px;color:#a9d3ff;margin-top:4px;font-weight:600}
.foot{display:flex;justify-content:space-between;color:#cfddf2;font-size:14px;margin-top:2vh}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#75d7a4;margin-right:7px;vertical-align:middle}
</style>
</head>
<body class="day">
<main>
  <div class="top">
    <div>
      <div class="eyebrow">Home &middot; Thornhill, Canada</div>
      <div id="clock">--:--</div>
      <div id="date">Loading date&hellip;</div>
      <div class="india">
        <div class="india-label">India</div>
        <div id="indiaTime">--:--</div>
        <div id="indiaDay"></div>
      </div>
    </div>
    <div class="now">
      <div id="nowIcon">&#9729;&#65038;</div>
      <div id="nowTemp">--&deg;</div>
      <div id="nowCond">Loading weather&hellip;</div>
      <div id="nowFeels"></div>
      <div id="todayRange"></div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="chips">
    <div class="chip"><div class="chip-label">Rain chance today</div><div class="chip-value" id="rainChance">—</div><div class="chip-sub" id="rainSub">—</div></div>
    <div class="chip"><div class="chip-label">Wind</div><div class="chip-value" id="wind">—</div><div class="chip-sub">km/h</div></div>
    <div class="chip"><div class="chip-label">Humidity</div><div class="chip-value" id="humidity">—</div><div class="chip-sub">relative</div></div>
    <div class="chip"><div class="chip-label">Sunset</div><div class="chip-value" id="sun">—</div><div class="chip-sub" id="sunSub">sunrise</div></div>
  </div>
  <div id="advice">Checking what you need before you head out&hellip;</div>
  <div id="quote"></div>
  <div class="forecast" id="forecast"></div>
  <div class="foot">
    <div><span class="dot"></span><span id="status">Weather loading</span></div>
    <div>Entrance dashboard &middot; weather refreshes every 15 min</div>
  </div>
</main>
<script>
function $(id){return document.getElementById(id);}
function pad(n){return (n<10?'0':'')+n;}
function fmt24(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmt12(d){var h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;return h+':'+pad(d.getMinutes())+' '+ap;}
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DAYS_S=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var QUOTES=[
['The best way to predict the future is to create it.','Peter Drucker'],
['Small deeds done are better than great deeds planned.','Peter Marshall'],
['What we achieve inwardly will change outer reality.','Plutarch'],
['The journey of a thousand miles begins with a single step.','Lao Tzu'],
['That which does not kill us makes us stronger.','Friedrich Nietzsche'],
['Life is what happens when you are busy making other plans.','John Lennon'],
['Strive not to be a success, but rather to be of value.','Albert Einstein'],
['The only way to do great work is to love what you do.','Steve Jobs'],
['Whether you think you can or you think you can\u2019t, you\u2019re right.','Henry Ford'],
['The best time to plant a tree was twenty years ago. The second best time is now.','Chinese proverb'],
['It always seems impossible until it\u2019s done.','Nelson Mandela'],
['Do not wait to strike till the iron is hot; but make it hot by striking.','William Butler Yeats'],
['Everything you\u2019ve ever wanted is on the other side of fear.','George Addair'],
['Hardships often prepare ordinary people for an extraordinary destiny.','C.S. Lewis'],
['Believe you can and you\u2019re halfway there.','Theodore Roosevelt'],
['What lies in our power to do, lies in our power not to do.','Aristotle'],
['The future belongs to those who believe in the beauty of their dreams.','Eleanor Roosevelt'],
['Do one thing every day that scares you.','Eleanor Roosevelt'],
['Success usually comes to those who are too busy to be looking for it.','Henry David Thoreau'],
['Don\u2019t be afraid to give up the good to go for the great.','John D. Rockefeller'],
['I find that the harder I work, the more luck I seem to have.','Thomas Jefferson'],
['The way to get started is to quit talking and begin doing.','Walt Disney'],
['If you can dream it, you can do it.','Walt Disney'],
['Happiness is not something ready made. It comes from your own actions.','Dalai Lama'],
['In the middle of difficulty lies opportunity.','Albert Einstein'],
['Simplicity is the ultimate sophistication.','Leonardo da Vinci'],
['A year from now you may wish you had started today.','Karen Lamb'],
['Act as if what you do makes a difference. It does.','William James'],
['Well done is better than well said.','Benjamin Franklin'],
['Energy and persistence conquer all things.','Benjamin Franklin'],
['The secret of getting ahead is getting started.','Mark Twain']
];
function indiaNow(){
  var now=new Date();
  var utc=now.getTime()+(now.getTimezoneOffset()*60000);
  return new Date(utc+(330*60000));
}
function dayOfYear(d){var s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/86400000);}
function showQuote(){
  var q=QUOTES[dayOfYear(new Date())%QUOTES.length];
  $('quote').innerHTML='\u201C'+q[0]+'\u201D<div id="quoteAuthor">\u2014 '+q[1]+'</div>';
}
function tick(){
  var now=new Date();
  $('clock').textContent=fmt24(now);
  $('date').textContent=DAYS[now.getDay()]+', '+MONTHS[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();
  var ind=indiaNow();
  $('indiaTime').textContent=fmt24(ind);
  $('indiaDay').textContent=DAYS[ind.getDay()]+', '+MONTHS[ind.getMonth()]+' '+ind.getDate();
  var h=now.getHours(),cls;
  if(h>=5&&h<8)cls='dawn';else if(h>=8&&h<17)cls='day';else if(h>=17&&h<21)cls='dusk';else cls='night';
  if(document.body.className!==cls){document.body.className=cls;showQuote();}
}
showQuote(); tick(); setInterval(tick,1000);

var CODES={0:['Clear sky','\u2600\uFE0F'],1:['Mainly clear','\uD83C\uDF24\uFE0F'],2:['Partly cloudy','\u26C5'],3:['Overcast','\u2601\uFE0F'],
45:['Fog','\uD83C\uDF2B\uFE0F'],48:['Rime fog','\uD83C\uDF2B\uFE0F'],51:['Light drizzle','\uD83C\uDF26\uFE0F'],53:['Drizzle','\uD83C\uDF26\uFE0F'],55:['Heavy drizzle','\uD83C\uDF27\uFE0F'],
56:['Freezing drizzle','\uD83C\uDF27\uFE0F'],57:['Freezing drizzle','\uD83C\uDF27\uFE0F'],61:['Light rain','\uD83C\uDF26\uFE0F'],63:['Rain','\uD83C\uDF27\uFE0F'],65:['Heavy rain','\uD83C\uDF27\uFE0F'],
66:['Freezing rain','\uD83C\uDF27\uFE0F'],67:['Freezing rain','\uD83C\uDF27\uFE0F'],71:['Light snow','\uD83C\uDF28\uFE0F'],73:['Snow','\u2744\uFE0F'],75:['Heavy snow','\u2744\uFE0F'],
77:['Snow grains','\u2744\uFE0F'],80:['Rain showers','\uD83C\uDF26\uFE0F'],81:['Rain showers','\uD83C\uDF27\uFE0F'],82:['Heavy showers','\uD83C\uDF27\uFE0F'],
85:['Snow showers','\uD83C\uDF28\uFE0F'],86:['Snow showers','\u2744\uFE0F'],95:['Thunderstorm','\u26C8\uFE0F'],96:['Thunderstorm','\u26C8\uFE0F'],99:['Thunderstorm','\u26C8\uFE0F']};
function codeInfo(c){return CODES[c]||['Conditions unavailable','\uD83C\uDF21\uFE0F'];}
function parseLocal(s){var p=s.split('T');var d=p[0].split('-');var t=(p[1]||'00:00').split(':');return new Date(+d[0],+d[1]-1,+d[2],+t[0],+t[1]);}
function jacketAdvice(feels,rainPct,code){
  var parts=[];
  if(feels<=-10)parts.push('\uD83E\uDDE5 Heavy winter coat, hat and gloves');
  else if(feels<0)parts.push('\uD83E\uDDE5 Winter coat weather');
  else if(feels<8)parts.push('\uD83E\uDDE5 Warm jacket weather');
  else if(feels<15)parts.push('\uD83E\uDDE7 Light jacket weather');
  else if(feels<22)parts.push('\uD83D\uDC55 Long sleeves are fine');
  else parts.push('\uD83D\uDC55 T-shirt weather');
  if(rainPct>=50)parts.push('\u2602\uFE0F Take an umbrella \u2014 rain is likely');
  else if(rainPct>=30)parts.push('\u2602\uFE0F Umbrella worth grabbing');
  if(code>=71&&code<=86)parts.push('\u2744\uFE0F Snow today \u2014 boots help');
  if(code>=95)parts.push('\u26C8\uFE0F Thunderstorms today');
  return parts.join('  \u00B7  ');
}
function loadWeather(){
  var url='https://api.open-meteo.com/v1/forecast?latitude=43.81&longitude=-79.42&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=celsius&wind_speed_unit=kmh&timezone=America%2FToronto&forecast_days=4';
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    try{
      if(xhr.status!==200)throw new Error('bad status');
      var d=JSON.parse(xhr.responseText),c=d.current,daily=d.daily,info=codeInfo(c.weather_code);
      $('nowTemp').textContent=Math.round(c.temperature_2m)+'\u00B0C';
      $('nowCond').textContent=info[0];
      $('nowIcon').textContent=info[1];
      $('nowFeels').textContent='Feels like '+Math.round(c.apparent_temperature)+'\u00B0C';
      $('todayRange').textContent='Today '+Math.round(daily.temperature_2m_max[0])+'\u00B0 / '+Math.round(daily.temperature_2m_min[0])+'\u00B0';
      var rp=(daily.precipitation_probability_max&&daily.precipitation_probability_max[0]!=null)?Math.round(daily.precipitation_probability_max[0]):null;
      $('rainChance').textContent=(rp==null?'\u2014':rp+'%');
      $('rainSub').textContent=(rp==null?'\u2014':(rp>=50?'rain likely':(rp>=30?'possible rain':'mostly dry')));
      $('wind').textContent=Math.round(c.wind_speed_10m);
      $('humidity').textContent=Math.round(c.relative_humidity_2m)+'%';
      var sr=parseLocal(daily.sunrise[0]),ss=parseLocal(daily.sunset[0]);
      $('sun').textContent=fmt12(ss);
      $('sunSub').textContent='sunrise '+fmt12(sr);
      $('advice').textContent=jacketAdvice(c.apparent_temperature,(rp==null?0:rp),c.weather_code);
      var html='';
      for(var i=0;i<daily.time.length;i++){
        var name=(i===0)?'Today':DAYS_S[parseLocal(daily.time[i]).getDay()];
        var di=codeInfo(daily.weather_code[i]);
        var dr=(daily.precipitation_probability_max&&daily.precipitation_probability_max[i]!=null)?Math.round(daily.precipitation_probability_max[i]):null;
        html+='<div class="day"><div class="day-name">'+name+'</div><div class="day-icon">'+di[1]+'</div><div class="day-temp">'+Math.round(daily.temperature_2m_max[i])+'\u00B0 / '+Math.round(daily.temperature_2m_min[i])+'\u00B0</div><div class="day-rain">'+(dr==null?'':'\uD83D\uDCA7 '+dr+'%')+'</div></div>';
      }
      $('forecast').innerHTML=html;
      $('status').textContent='Weather updated '+fmt12(new Date());
    }catch(e){
      $('nowCond').textContent='Weather unavailable';
      $('status').textContent='Weather feed unavailable \u2014 check Wi-Fi';
    }
  };
  xhr.send();
}
loadWeather(); setInterval(loadWeather,15*60*1000);
setTimeout(function(){location.reload();},6*60*60*1000);
</script>
</body>
</html>
