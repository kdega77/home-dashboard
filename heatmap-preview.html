function clickSound(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    var ctx=new AC(),t=ctx.currentTime;
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';
    o.frequency.setValueAtTime(240,t);
    o.frequency.exponentialRampToValueAtTime(110,t+0.06);
    g.gain.setValueAtTime(0.18,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    o.start(t);o.stop(t+0.09);
    var o2=ctx.createOscillator(),g2=ctx.createGain();
    o2.connect(g2);g2.connect(ctx.destination);
    o2.type='triangle';
    o2.frequency.value=1400;
    g2.gain.setValueAtTime(0.03,t);
    g2.gain.exponentialRampToValueAtTime(0.001,t+0.02);
    o2.start(t);o2.stop(t+0.03);
  }catch(e){}
}
function tileColor(chg){
  if(chg>=3)return '#00843d';
  if(chg>=1)return '#00a651';
  if(chg>=0)return '#2e9e5b';
  if(chg>-1)return '#c0392b';
  if(chg>-3)return '#d32f2f';
  return '#b71c1c';
}
function sumV(items){var s=0,i;for(i=0;i<items.length;i++)s+=items[i].v;return s;}
/* Balanced split: cut the rectangle along its longer side so both halves
   hold about half the total value. Tiles come out squarish, like a
   traditional treemap, instead of long thin strips. */
function splitRect(items,x,y,w,h,out){
  var i,total,acc,idx,left,right,leftTotal,frac;
  if(items.length===1){out.push({it:items[0],x:x,y:y,w:w,h:h});return;}
  total=sumV(items);acc=0;idx=0;
  for(i=0;i<items.length;i++){acc+=items[i].v;if(acc>=total/2){idx=i;break;}}
  left=items.slice(0,idx+1);right=items.slice(idx+1);
  if(!right.length){left=items.slice(0,items.length-1);right=items.slice(items.length-1);}
  leftTotal=sumV(left);frac=leftTotal/total;
  if(w>=h){var w1=w*frac;splitRect(left,x,y,w1,h,out);splitRect(right,x+w1,y,w-w1,h,out);}
  else{var h1=h*frac;splitRect(left,x,y,w,h1,out);splitRect(right,x,y+h1,w,h-h1,out);}
}
function renderMap(id){
  var area=document.getElementById('mapArea');
  var W=area.offsetWidth,H=area.offsetHeight;
  area.innerHTML='';
  if(!W||!H)return;
  var stocks=DATA[id].slice();
  stocks.sort(function(a,b){return b.cap-a.cap;});
  var secs={},names=[],i,j,s;
  for(i=0;i<stocks.length;i++){s=stocks[i];if(!secs[s.sec]){secs[s.sec]={name:s.sec,total:0,items:[]};names.push(s.sec);}secs[s.sec].total+=s.cap;secs[s.sec].items.push(s);}
  var secList=[];
  for(i=0;i<names.length;i++)secList.push(secs[names[i]]);
  secList.sort(function(a,b){return b.total-a.total;});
  var secItems=[];
  for(i=0;i<secList.length;i++)secList[i].items.sort(function(a,b){return b.cap-a.cap;});
  for(i=0;i<secList.length;i++)secItems.push({v:secList[i].total,sec:secList[i]});
  var secRects=[];
  splitRect(secItems,0,0,W,H,secRects);
  for(i=0;i<secRects.length;i++){
    var r=secRects[i],sec=r.it.sec;
    var label=document.createElement('div');
    label.className='sec-label';
    label.textContent=sec.name;
    label.style.left=(r.x+4)+'px';label.style.top=(r.y+3)+'px';
    area.appendChild(label);
    var tiles=[];
    var items=[];
    for(j=0;j<sec.items.length;j++)items.push({v:sec.items[j].cap,st:sec.items[j]});
    splitRect(items,r.x,r.y+16,r.w,r.h-16,tiles);
    for(j=0;j<tiles.length;j++){
      var t=tiles[j],st=t.it.st;
      var tw=Math.max(0,t.w-2),th=Math.max(0,t.h-2);
      if(tw<8||th<8)continue;
      var d=document.createElement('div');
      d.className='tile';
      d.style.left=(t.x+1)+'px';d.style.top=(t.y+1)+'px';
      d.style.width=tw+'px';d.style.height=th+'px';
      d.style.background=tileColor(st.chg);
      var fs=Math.max(8,Math.min(20,Math.min(tw/(st.s.length*0.72),th/3.4)));
      var sign=st.chg>=0?'+':'';
      var inner='<div class="t" style="font-size:'+Math.round(fs)+'px">'+st.s+'</div>';
      if(th>=26)inner+='<div class="p" style="font-size:'+Math.round(fs*0.85)+'px">'+sign+st.chg.toFixed(2)+'</div>';
      d.innerHTML=inner;
      area.appendChild(d);
    }
  }
}
var currentMap='sp';
function showMap(id){
  currentMap=id;
  var ids=['sp','nse','tsx'],i;
  for(i=0;i<ids.length;i++){
    document.getElementById('tab-'+ids[i]).className='tab'+((ids[i]===id)?' on':'');
  }
  renderMap(id);
}
var lastTap=0;
function tapMap(id){var n=new Date().getTime();if(n-lastTap<500)return;lastTap=n;clickSound();showMap(id);}
function goBack(){clickSound();setTimeout(function(){location.href='entrance.html';},90);}
(function(){
  var m=location.search.match(/tab=(sp|nse|tsx)/);
  if(m)currentMap=m[1];
  showMap(currentMap);
  window.addEventListener('resize',function(){renderMap(currentMap);});
})();
